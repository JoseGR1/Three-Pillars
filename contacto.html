<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="site.title_contact"></title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="page-contact">
  <canvas id="stars" class="stars"></canvas>

  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Home">
      <img src="assets/logo.svg" alt="Logo" class="brand-icon">
      <h1>Three Pillars</h1>
    </a>
    <nav class="nav">
      <a rel="prefetch" href="index.html" data-i18n="nav.home">Inicio</a>
      <a class="active" rel="prefetch" href="contacto.html" data-i18n="nav.contact">Contacto</a>
    </nav>
<!-- Selector de idioma -->
<div class="lang fancy-lang" id="lang">
  <!-- nativo escondido (lo usa i18n.js) -->
  <select id="langSwitcher" aria-hidden="true" tabindex="-1">
    <option value="es">ES · Español</option>
    <option value="en">EN · English</option>
  </select>

  <!-- UI custom -->
  <button class="lang-btn" id="langTrigger" type="button" aria-haspopup="listbox" aria-expanded="false">
    <span class="lang-current">ES</span>
    <svg class="caret" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
      <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
    </svg>
  </button>

  <ul class="lang-menu" role="listbox">
    <li role="option" data-value="es" class="active">
      <span class="tag">ES</span><span>Español</span>
    </li>
    <li role="option" data-value="en">
      <span class="tag">EN</span><span>English</span>
    </li>
  </ul>
</div>

  </header>

  <main class="container">
    <section class="section">
      <h2 class="title" data-i18n="contact.about_title">Sobre el proyecto</h2>
      <p class="context" data-i18n="contact.about_body">
        Tres amigos, un lienzo infinito...
      </p>
    </section>

    <section class="section">
      <h2 class="subtitle" data-i18n="contact.contacts_title">Contactos</h2>
      <p class="lead" data-i18n="contact.contacts_lead">Instagram y Discord</p>

      <div id="contactCards" class="cards cards-contacts"></div>
    </section>
  </main>

  <footer class="site-footer">
    <small>© <span id="year"></span> Three Pillars.</small>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/contact.js"></script>
  <script src="js/lang-ui.js"></script>

</body>
</html>
