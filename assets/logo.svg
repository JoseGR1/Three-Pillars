<!-- Logo circular: Saturno -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Saturno">
  <defs>
    <!-- Fondo espacial -->
    <radialGradient id="space" cx="42%" cy="36%" r="78%">
      <stop offset="0%"  stop-color="#0b1226"/>
      <stop offset="60%" stop-color="#080f1f"/>
      <stop offset="100%" stop-color="#040911"/>
    </radialGradient>

    <!-- Borde exterior del badge -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#00d4ff" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#a18cff" stop-opacity=".7"/>
    </linearGradient>

    <!-- Bandas de color de Saturno (top->bottom) -->
    <linearGradient id="saturnBands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f6e7c8"/>
      <stop offset="17%"  stop-color="#ead7b3"/>
      <stop offset="32%"  stop-color="#d9c39a"/>
      <stop offset="45%"  stop-color="#f3e2c3"/>
      <stop offset="58%"  stop-color="#d2b78d"/>
      <stop offset="72%"  stop-color="#e7d5b4"/>
      <stop offset="100%" stop-color="#c9ab86"/>
    </linearGradient>

    <!-- Sombreado esférico -->
    <radialGradient id="sphereShade" cx="62%" cy="38%" r="65%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".55"/>
    </radialGradient>

    <!-- Brillo especular -->
    <radialGradient id="spec" cx="68%" cy="30%" r="18%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente de anillos (ámbar -> crema) -->
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c9b29c"/>
      <stop offset="30%"  stop-color="#f7e6c6"/>
      <stop offset="55%"  stop-color="#fff4dc"/>
      <stop offset="75%"  stop-color="#f1d4a6"/>
      <stop offset="100%" stop-color="#bfa78f"/>
    </linearGradient>

    <!-- Bruma azulada mínima en los anillos (opcional) -->
    <linearGradient id="ringCool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#9ac7ff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#9ac7ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Filtros -->
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Máscaras para partir los anillos delante/detrás del planeta -->
    <!-- Detrás: muestra anillos fuera del círculo del planeta -->
    <mask id="behind">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="256" cy="256" r="112" fill="#000"/>
    </mask>
    <!-- Delante: muestra anillos sólo dentro del círculo del planeta -->
    <mask id="front">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="256" cy="256" r="112" fill="#fff"/>
    </mask>

    <!-- Clip circular del badge -->
    <clipPath id="badge">
      <circle cx="256" cy="256" r="246"/>
    </clipPath>

    <!-- Estrellitas -->
    <symbol id="spark" viewBox="0 0 20 20">
      <path d="M10 0 L12 8 L20 10 L12 12 L10 20 L8 12 L0 10 L8 8 Z" fill="#ffffff"/>
    </symbol>
  </defs>

  <g clip-path="url(#badge)">
    <!-- Fondo espacial -->
    <rect width="512" height="512" fill="url(#space)"/>

    <!-- Estrellas sutiles -->
    <g fill="#ffffff" opacity=".85">
      <circle cx="120" cy="90" r="1.2"/><circle cx="420" cy="120" r="1.1"/>
      <circle cx="80"  cy="260" r="1.2"/><circle cx="360" cy="380" r="1.3"/>
      <use href="#spark" x="360" y="88" width="16" height="16" opacity=".9"/>
      <use href="#spark" x="150" y="380" width="12" height="12" opacity=".7"/>
    </g>

    <!-- Grupo principal levemente inclinado -->
    <g transform="rotate(-16 256 256)">
      <!-- ANILLOS (parte trasera) -->
      <g mask="url(#behind)" filter="url(#soft)">
        <ellipse cx="256" cy="256" rx="230" ry="72" fill="none" stroke="url(#ringGrad)" stroke-width="22"/>
        <ellipse cx="256" cy="256" rx="200" ry="62" fill="none" stroke="url(#ringGrad)" stroke-width="14"/>
        <ellipse cx="256" cy="256" rx="168" ry="50" fill="none" stroke="url(#ringCool)" stroke-width="10"/>
      </g>

      <!-- PLANETA -->
      <g>
        <circle cx="256" cy="256" r="112" fill="url(#saturnBands)"/>
        <circle cx="256" cy="256" r="112" fill="url(#sphereShade)"/>
        <ellipse cx="292" cy="220" rx="38" ry="20" fill="url(#spec)"/>
      </g>

      <!-- Sombra del planeta sobre los anillos (da profundidad) -->
      <ellipse cx="256" cy="270" rx="170" ry="50" fill="#000" opacity=".18" filter="url(#soft)"/>

      <!-- ANILLOS (parte delantera) -->
      <g mask="url(#front)" filter="url(#glow)">
        <ellipse cx="256" cy="256" rx="230" ry="72" fill="none" stroke="url(#ringGrad)" stroke-width="22"/>
        <ellipse cx="256" cy="256" rx="200" ry="62" fill="none" stroke="url(#ringGrad)" stroke-width="14"/>
        <ellipse cx="256" cy="256" rx="168" ry="50" fill="none" stroke="url(#ringCool)" stroke-width="10"/>
      </g>
    </g>
  </g>

  <!-- Borde del badge -->
  <circle cx="256" cy="256" r="246" fill="none" stroke="url(#rim)" stroke-width="2.2" opacity=".9"/>
</svg>
